<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANSH THRIFTS · Add Product</title>

  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <style>
    body {
      background: url('{{ url_for("static", filename="images/login-img.jpg") }}') no-repeat center center/cover;
      background-attachment: fixed;
      min-height: 100vh;
    }
  </style>
</head>

<body>
  {% include "_flash_messages.html" %}

  <div class="container" style="margin-top: 40px; max-width: 650px;">
    <div class="dashboard-wrapper">
      <div class="glass-effect p-4">
        <h1 class="text-center mb-4" style="font-family: 'Playfair Display', serif; color: #1a1a1a;">Add New Product</h1>

        <form action="{{ url_for('admin') }}" method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="name" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>
          <div class="mb-3">
            <label for="price" class="form-label">Price (₹)</label>
            <input type="number" class="form-control" id="price" name="price" required>
          </div>
          <div class="mb-3">
            <label for="details" class="form-label">Product Details</label>
            <textarea class="form-control" id="details" name="details" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label for="slug" class="form-label">Slug</label>
            <input type="text" class="form-control" id="slug" name="slug" required>
          </div>
          <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" name="category" required>
              <option value="Jackets">Jackets</option>
              <option value="T-Shirts">T-Shirts</option>
              <option value="Jeans">Jeans</option>
              <option value="Shirts">Shirts</option>
              <option value="Hoodies">Hoodies</option>
              <option value="General">General</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="img_file" class="form-label">Upload Image</label>
            <input type="file" class="form-control" id="img_file" name="img_file" accept="image/*" required>
          </div>
          <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-secondary">Add Product</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="background: #555; border-color: #555;">Back to Dashboard</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>

</html>
