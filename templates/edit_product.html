<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANSH THRIFTS · Edit Product</title>

  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <style>
    body {
      background: url('{{ url_for("static", filename="images/login-img.jpg") }}') no-repeat center center/cover;
      background-attachment: fixed;
      min-height: 100vh;
    }
  </style>
</head>

<body>
  {% include "_flash_messages.html" %}

  <div class="container" style="margin-top: 40px; max-width: 650px;">
    <div class="dashboard-wrapper">
      <div class="glass-effect p-4">
        <h1 class="text-center mb-4" style="font-family: 'Playfair Display', serif; color: #1a1a1a;">Edit Product</h1>

        <form action="{{ url_for('edit_product', product_id=product._id) }}" method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="name" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ product.p_name }}" required>
          </div>
          <div class="mb-3">
            <label for="price" class="form-label">Price (₹)</label>
            <input type="number" class="form-control" id="price" name="price" value="{{ product.p_price }}" required>
          </div>
          <div class="mb-3">
            <label for="details" class="form-label">Details</label>
            <textarea class="form-control" id="details" name="details" rows="3" required>{{ product.p_details }}</textarea>
          </div>
          <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" name="category" required>
              <option value="Jackets" {% if product.get('category') == 'Jackets' %}selected{% endif %}>Jackets</option>
              <option value="T-Shirts" {% if product.get('category') == 'T-Shirts' %}selected{% endif %}>T-Shirts</option>
              <option value="Jeans" {% if product.get('category') == 'Jeans' %}selected{% endif %}>Jeans</option>
              <option value="Shirts" {% if product.get('category') == 'Shirts' %}selected{% endif %}>Shirts</option>
              <option value="Hoodies" {% if product.get('category') == 'Hoodies' %}selected{% endif %}>Hoodies</option>
              <option value="General" {% if product.get('category') in [None, '', 'General'] %}selected{% endif %}>General</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="img_file" class="form-label">Product Image</label>
            <input type="file" class="form-control" id="img_file" name="img_file" accept="image/*">
            <div class="mt-2">
              <img src="{{ url_for('static', filename='images/' ~ product.img_file) }}"
                   alt="{{ product.p_name }}" class="img-thumbnail" width="100" style="border-radius: 10px;">
              <small class="text-muted d-block mt-1">Leave empty to keep current image</small>
            </div>
          </div>
          <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-secondary">Update Product</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="background: #555; border-color: #555;">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>

</html>
