<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANSH THRIFTS · Contact</title>

  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: url('{{ url_for("static", filename="images/login-img.jpg") }}') no-repeat center center/cover;
      background-attachment: fixed;
    }
  </style>
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh;">
  <!-- Navbar -->
  <nav class="custom-navbar navbar navbar-expand-md navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">ANSH THRIFTS<span>.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-between" id="navbarMain">
        <ul class="navbar-nav ms-md-5">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/shop">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="/contact">Contact</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/login">
              <img src="{{ url_for('static', filename='images/user.svg') }}" alt="Account">
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/cart">
              <img src="{{ url_for('static', filename='images/cart.svg') }}" alt="Cart">
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  {% include "_flash_messages.html" %}

  <!-- Contact Form -->
  <div class="contact-page-wrapper" style="flex: 1;">
    <div class="glass-card">
      <h2 style="font-family: 'Playfair Display', serif; margin-bottom: 20px;">Get In Touch</h2>

      <div class="row mb-4 text-center contact-info">
        <div class="col-12 col-sm-4 mb-3 mb-sm-0">
          <div class="service-icon">📍</div>
          <p class="small mb-0">43 Raymouth Rd, Baltemoer, London 3910</p>
        </div>
        <div class="col-12 col-sm-4 mb-3 mb-sm-0">
          <div class="service-icon">📧</div>
          <p class="small mb-0"><a href="mailto:{{ contact_email }}">{{ contact_email }}</a></p>
        </div>
        <div class="col-12 col-sm-4">
          <div class="service-icon">📞</div>
          <p class="small mb-0">+1 294 3925 3939</p>
        </div>
      </div>

      <form method="POST" action="{{ url_for('contact') }}" class="contact-form">
        <div class="row">
          <div class="col-12 col-md-6 mb-3">
            <input type="text" class="form-control" name="name" placeholder="Your Name" required>
          </div>
          <div class="col-12 col-md-6 mb-3">
            <input type="email" class="form-control" name="email" placeholder="Your Email" required>
          </div>
          <div class="col-12 mb-3">
            <input type="tel" class="form-control" name="phone" placeholder="Your Phone Number" required>
          </div>
          <div class="col-12 mb-3">
            <textarea class="form-control" name="message" rows="4" placeholder="Your Message" required style="border-radius: 16px;"></textarea>
          </div>
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-custom w-100">Send Message</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-section">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6 text-center text-md-start">
          <p class="mb-0">&copy; <script>document.write(new Date().getFullYear());</script> ANSH THRIFTS. All Rights Reserved.</p>
        </div>
        <div class="col-md-6 text-center text-md-end">
          <ul class="list-unstyled d-inline-flex gap-4 mb-0">
            <li><a href="{{ url_for('about') }}">About</a></li>
            <li><a href="{{ url_for('shop') }}">Shop</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>

</html>
